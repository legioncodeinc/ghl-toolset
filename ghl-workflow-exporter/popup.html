<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GHL Workflow Exporter</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Workflow Exporter</h1>
    <p id="target" class="muted">Checking this tab&hellip;</p>
  </header>

  <button id="run" disabled>Export workflows</button>

  <div id="progress" hidden>
    <div class="bar"><span id="fill"></span></div>
    <p id="step" class="muted"></p>
  </div>

  <p id="status" role="status"></p>

  <footer class="muted">
    Reads only. Nothing in this sub-account is modified.
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
